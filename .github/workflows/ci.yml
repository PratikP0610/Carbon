name: Carbon Offline CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, Type Check & Offline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run ruff lint
        run: ruff check .

      - name: Check Python code formatting
        run: ruff format --check src tests scripts benchmarks

      - name: Run mypy static type checks
        run: mypy src

      - name: Run offline cross-platform test suite with coverage
        run: pytest -m "not requires_ollama and not requires_macos" --cov=src/carbon --cov-report=term-missing
